<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>ABSWAR — Final UI</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  background: #030407;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
}

.stage {
  position: relative;
  width: 1280px;
  height: 853px;
  margin: 0 auto;
  background-image: url("./assets/abswar-final-ui.jpg");
  background-repeat: no-repeat;
  background-position: center top;
  background-size: 1280px 853px;
  overflow: hidden;
}

.scanlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.025) 0px,
    rgba(255,255,255,0.025) 1px,
    transparent 1px,
    transparent 4px
  );
  mix-blend-mode: screen;
  opacity: .35;
}

.attack-line {
  position: absolute;
  height: 2px;
  transform-origin: left center;
  background: linear-gradient(90deg, transparent, #ff244a, #fff, transparent);
  box-shadow: 0 0 16px #ff244a, 0 0 30px rgba(255,36,74,.55);
  opacity: 0;
  pointer-events: none;
}

.l1 { left: 229px; top: 224px; width: 275px; transform: rotate(-5deg); animation: flow 2.4s infinite; }
.l2 { left: 392px; top: 339px; width: 247px; transform: rotate(-25deg); animation: flow 2.8s infinite .5s; }
.l3 { left: 546px; top: 237px; width: 170px; transform: rotate(31deg); animation: flow 2.6s infinite 1s; }

@keyframes flow {
  0% { opacity: 0; clip-path: inset(0 100% 0 0); }
  20% { opacity: 1; }
  55% { opacity: 1; clip-path: inset(0 0 0 0); }
  100% { opacity: 0; clip-path: inset(0 0 0 100%); }
}

.live-dot {
  position: absolute;
  left: 1016px;
  top: 795px;
  width: 10px;
  height: 10px;
  background: #00ff88;
  border-radius: 50%;
  box-shadow: 0 0 14px #00ff88;
  animation: pulse 1s infinite;
  pointer-events: none;
}

@keyframes pulse {
  50% { transform: scale(1.7); opacity: .55; }
}

.hotspot {
  position: absolute;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.hotspot:hover {
  outline: 1px solid rgba(255,36,74,.45);
  outline-offset: -1px;
}

.nav-dashboard { left: 188px; top: 0; width: 65px; height: 47px; }
.nav-map { left: 253px; top: 0; width: 43px; height: 47px; }
.nav-countries { left: 304px; top: 0; width: 70px; height: 47px; }
.nav-alliances { left: 378px; top: 0; width: 76px; height: 47px; }
.nav-stats { left: 463px; top: 0; width: 50px; height: 47px; }
.nav-market { left: 525px; top: 0; width: 65px; height: 47px; }
.nav-ranking { left: 596px; top: 0; width: 72px; height: 47px; }

.wallet { left: 722px; top: 12px; width: 103px; height: 28px; }
.buy-basic { left: 1000px; top: 365px; width: 34px; height: 24px; }
.buy-advanced { left: 1000px; top: 413px; width: 34px; height: 24px; }
.buy-premium { left: 1000px; top: 459px; width: 34px; height: 24px; }
.buy-legendary { left: 1000px; top: 505px; width: 34px; height: 24px; }

.join-war { right: 18px; bottom: 18px; width: 135px; height: 38px; }
.view-ranking { left: 1090px; top: 345px; width: 135px; height: 25px; }
.view-history { left: 27px; top: 748px; width: 181px; height: 27px; }
.chat-input { left: 249px; top: 742px; width: 150px; height: 27px; }
.chat-send { left: 399px; top: 742px; width: 24px; height: 27px; }
.scan-upgrades { left: 640px; top: 748px; width: 130px; height: 27px; }
.view-regions { left: 790px; top: 748px; width: 165px; height: 27px; }
.view-news { left: 1042px; top: 748px; width: 175px; height: 27px; }

.attack-greece { left: 17px; top: 685px; width: 195px; height: 22px; }
.attack-bulgaria { left: 17px; top: 725px; width: 195px; height: 22px; }

.status-pill {
  position: absolute;
  right: 18px;
  top: 58px;
  min-width: 192px;
  padding: 8px 11px;
  border: 1px solid rgba(0,255,136,.42);
  border-radius: 10px;
  background: rgba(4,10,18,.72);
  box-shadow: 0 0 18px rgba(0,255,136,.18);
  font-size: 11px;
  z-index: 5;
}

.status-pill strong {
  display: block;
  color: #00ff88;
  font-size: 13px;
  margin-top: 3px;
  text-shadow: 0 0 10px #00ff88;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  background: #080d14;
  border: 1px solid rgba(255,36,74,.75);
  color: white;
  border-radius: 12px;
  padding: 12px 16px;
  box-shadow: 0 0 25px rgba(255,36,74,.45);
  display: none;
  z-index: 99;
  font-size: 14px;
}

.toast.show {
  display: block;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.84);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 90;
}

.modal.show {
  display: flex;
}

.box {
  width: 760px;
  max-height: 80vh;
  overflow: auto;
  background: #071018;
  border: 1px solid rgba(255,36,74,.72);
  border-radius: 16px;
  box-shadow: 0 0 45px rgba(255,36,74,.35);
  padding: 28px;
}

.box h1 {
  margin-top: 0;
  color: #ff405f;
}

.box p, .box li {
  color: #dcecff;
  line-height: 1.7;
}

.close {
  float: right;
  background: #2a0610;
  color: #ff6b82;
  border: 1px solid #ff244a;
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  font-weight: 900;
}

@media (max-width: 1280px) {
  .stage {
    transform-origin: top left;
  }
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="scanlines"></div>
  <div class="attack-line l1"></div>
  <div class="attack-line l2"></div>
  <div class="attack-line l3"></div>
  <div class="live-dot"></div>

  <div class="status-pill">
    ABSWAR SERVER
    <strong id="serverStatus">Kontrol ediliyor...</strong>
    <span id="serverInfo">Backend bağlantısı</span>
  </div>

  <button class="hotspot nav-dashboard" onclick="showToast('Dashboard aktif')"></button>
  <button class="hotspot nav-map" onclick="showToast('Map aktif')"></button>
  <button class="hotspot nav-countries" onclick="openModal('countries')"></button>
  <button class="hotspot nav-alliances" onclick="openModal('alliances')"></button>
  <button class="hotspot nav-stats" onclick="openModal('stats')"></button>
  <button class="hotspot nav-market" onclick="openModal('market')"></button>
  <button class="hotspot nav-ranking" onclick="openModal('ranking')"></button>

  <button class="hotspot wallet" onclick="connectWallet()"></button>
  <button class="hotspot buy-basic" onclick="buyAmmo(1)"></button>
  <button class="hotspot buy-advanced" onclick="buyAmmo(10)"></button>
  <button class="hotspot buy-premium" onclick="buyAmmo(100)"></button>
  <button class="hotspot buy-legendary" onclick="buyAmmo(1000)"></button>

  <button class="hotspot join-war" onclick="joinWar()"></button>
  <button class="hotspot view-ranking" onclick="openModal('ranking')"></button>
  <button class="hotspot view-history" onclick="openModal('history')"></button>
  <button class="hotspot chat-send" onclick="sendRadio()"></button>
  <button class="hotspot scan-upgrades" onclick="showToast('Radar scan upgrade demo')"></button>
  <button class="hotspot view-regions" onclick="openModal('regions')"></button>
  <button class="hotspot view-news" onclick="openModal('news')"></button>
  <button class="hotspot attack-greece" onclick="attackCountry('GR')"></button>
  <button class="hotspot attack-bulgaria" onclick="attackCountry('BG')"></button>
</main>

<div class="modal" id="modal">
  <div class="box">
    <button class="close" onclick="closeModal()">KAPAT</button>
    <h1 id="modalTitle">ABSWAR</h1>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const API = "https://abswar-clean-backend-production.up.railway.app";
let wallet = "demo-player-" + Math.floor(Math.random() * 999999);
let gameState = null;

function scaleStage() {
  const stage = document.getElementById("stage");
  const scale = Math.min(window.innerWidth / 1280, 1);
  stage.style.transform = "scale(" + scale + ")";
  document.body.style.height = (853 * scale) + "px";
}

window.addEventListener("resize", scaleStage);
scaleStage();

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

function setStatus(text, info) {
  document.getElementById("serverStatus").textContent = text;
  document.getElementById("serverInfo").textContent = info || "";
}

async function checkBackend() {
  try {
    const res = await fetch(API + "/health");
    const data = await res.json();
    if (data.ok) {
      setStatus("ONLINE", "Realtime: " + !!data.realtime);
    } else {
      setStatus("HATA", "Backend response error");
    }
  } catch (e) {
    setStatus("OFFLINE", e.message);
  }
}

async function loadState() {
  try {
    const res = await fetch(API + "/api/game/state");
    gameState = await res.json();
  } catch (e) {
    showToast("State alınamadı: " + e.message);
  }
}

async function connectWallet() {
  if (!window.ethereum) {
    showToast("MetaMask bulunamadı. Demo wallet aktif.");
    return;
  }
  try {
    const accounts = await ethereum.request({ method: "eth_requestAccounts" });
    wallet = accounts[0].toLowerCase();
    await fetch(API + "/api/player/connect", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ wallet })
    });
    showToast("Wallet bağlandı: " + wallet.slice(0,6) + "..." + wallet.slice(-4));
  } catch (e) {
    showToast("Wallet iptal edildi");
  }
}

async function joinWar() {
  try {
    const res = await fetch(API + "/api/player/choose-country", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ wallet, countryCode: "TR" })
    });
    const data = await res.json();
    if (data.error) showToast(data.error);
    else showToast("Türkiye tarafına katıldın");
  } catch (e) {
    showToast("Join failed");
  }
}

async function buyAmmo(pack) {
  try {
    const res = await fetch(API + "/api/market/buy-demo", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ wallet, pack })
    });
    const data = await res.json();
    if (data.error) showToast(data.error);
    else showToast("+" + data.added + " mermi eklendi");
  } catch (e) {
    showToast("Market hatası");
  }
}

async function attackCountry(code) {
  try {
    await fetch(API + "/api/player/choose-country", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ wallet, countryCode: "TR" })
    });

    const res = await fetch(API + "/api/game/attack", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ wallet, targetCountry: code })
    });

    const data = await res.json();
    if (data.error) showToast(data.error);
    else showToast("Saldırı gönderildi: " + code);
  } catch (e) {
    showToast("Saldırı hatası");
  }
}

async function sendRadio() {
  try {
    const res = await fetch(API + "/api/alliance/radio", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ wallet, command: "ATTACK_NOW" })
    });
    const data = await res.json();
    if (data.error) showToast(data.error);
    else showToast(data.message);
  } catch (e) {
    showToast("Radio demo");
  }
}

function openModal(type) {
  const title = document.getElementById("modalTitle");
  const body = document.getElementById("modalBody");

  if (!gameState) {
    body.innerHTML = "<p>Veri yükleniyor...</p>";
  }

  if (type === "countries") {
    title.textContent = "Countries";
    body.innerHTML = (gameState?.countries || []).map(c =>
      `<p>${c.flag} <b>${c.name}</b> — HP: ${c.hp.toLocaleString()} / ${c.max_hp.toLocaleString()}</p>`
    ).join("") || "<p>Ülke verisi yok.</p>";
  }

  if (type === "alliances") {
    title.textContent = "Alliances";
    body.innerHTML = (gameState?.alliances || []).map(a =>
      `<p><b>${a.name}</b> — Score: ${a.score} — Members: ${a.members.length}</p>`
    ).join("") || "<p>Henüz alliance yok.</p>";
  }

  if (type === "ranking") {
    title.textContent = "Ranking";
    body.innerHTML = (gameState?.leaderboard || []).map((p,i) =>
      `<p>#${i+1} ${p.wallet.slice(0,12)} — ${p.contribution} pts</p>`
    ).join("") || "<p>Henüz ranking yok.</p>";
  }

  if (type === "market") {
    title.textContent = "Market";
    body.innerHTML = "<ul><li>$1 = 100 mermi</li><li>$10 = 1.000 mermi</li><li>$100 = 10.000 mermi</li><li>$1000 = 100.000 mermi</li></ul><p>Demo satın alma aktif. NFT/token yok.</p>";
  }

  if (type === "stats") {
    title.textContent = "Stats";
    body.innerHTML = `<p>Online: ${gameState?.onlinePlayers || 0}</p><p>Total Attacks: ${gameState?.war?.total_attacks || 0}</p><p>Countries Left: ${gameState?.war?.countries_left || 0}</p>`;
  }

  if (type === "history") {
    title.textContent = "Attack History";
    body.innerHTML = (gameState?.recentAttacks || []).map(a =>
      `<p>⚔️ ${a.from_country} → ${a.target_country} — -${a.damage} HP</p>`
    ).join("") || "<p>Henüz saldırı yok.</p>";
  }

  if (type === "regions") {
    title.textContent = "Resource Regions";
    body.innerHTML = "<p>Resource control sistemi sonraki aşamada backend’e bağlanacak.</p>";
  }

  if (type === "news") {
    title.textContent = "War News";
    body.innerHTML = "<p>Germany defenses collapsing!</p><p>USA alliance under attack!</p><p>Turkey launched a massive offensive!</p>";
  }

  document.getElementById("modal").classList.add("show");
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

const socket = io(API, { transports: ["websocket", "polling"] });

socket.on("connect", () => {
  setStatus("REALTIME ONLINE", "Socket connected");
});

socket.on("disconnect", () => {
  setStatus("REALTIME OFFLINE", "Socket disconnected");
});

socket.on("war:state", data => {
  gameState = data;
});

socket.on("war:attack", a => {
  showToast("Live attack: " + a.from_country + " → " + a.target_country);
});

socket.on("alliance:feed", x => {
  showToast(x.message);
});

checkBackend();
loadState();
setInterval(loadState, 4000);
</script>
</body>
</html>
