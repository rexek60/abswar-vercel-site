<main class="stage" id="stage">
  <button class="hotspot docs" onclick="openDocs()"></button>

  <button class="hotspot join" onclick="joinWar()"></button>
  <button class="hotspot buy1" onclick="buyAmmo(1)"></button>
  <button class="hotspot buy2" onclick="buyAmmo(10)"></button>

  <button class="hotspot alliances" onclick="openPanel('alliances')"></button>
  <button class="hotspot market" onclick="openPanel('market')"></button>
  <button class="hotspot ranking" onclick="openPanel('ranking')"></button>

  <button class="hotspot attackHistory" onclick="openPanel('history')"></button>
  <button class="hotspot news" onclick="openPanel('news')"></button>
</main>

<div class="modal" id="modal">
  <div class="box">
    <button class="close" onclick="closeModal()">KAPAT</button>
    <h1 id="modalTitle">ABSWAR</h1>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const API = "https://abswar-clean-backend-production.up.railway.app";
let wallet = "demo-player-" + Math.floor(Math.random()*999999);
let gameState = null;

function scaleStage(){
  const stage = document.getElementById("stage");
  const scale = Math.min(window.innerWidth / 1536, 1);
  stage.style.transform = "scale(" + scale + ")";
  document.body.style.height = (1024 * scale) + "px";
}
window.addEventListener("resize", scaleStage);
scaleStage();

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2600);
}

async function loadState(){
  try{
    const r = await fetch(API + "/api/game/state");
    gameState = await r.json();
  }catch(e){}
}

async function connectWallet(){
  if(!window.ethereum){
    toast("MetaMask bulunamadı. Demo wallet aktif.");
    return;
  }
  try{
    const acc = await ethereum.request({method:"eth_requestAccounts"});
    wallet = acc[0].toLowerCase();
    await fetch(API + "/api/player/connect", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({wallet})
    });
    toast("Wallet bağlandı: " + wallet.slice(0,6) + "..." + wallet.slice(-4));
  }catch(e){
    toast("Wallet bağlantısı iptal edildi.");
  }
}

async function joinWar(){
  const r = await fetch(API + "/api/player/choose-country", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({wallet,countryCode:"TR"})
  });
  const d = await r.json();
  toast(d.error || "Türkiye tarafına katıldın.");
}

async function buyAmmo(pack){
  const r = await fetch(API + "/api/market/buy-demo", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({wallet,pack})
  });
  const d = await r.json();
  toast(d.error || ("+" + d.added + " mermi eklendi."));
}

async function sendRadio(){
  const r = await fetch(API + "/api/alliance/radio", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({wallet,command:"ATTACK_NOW"})
  });
  const d = await r.json();
  toast(d.error || d.message || "Alliance mesajı gönderildi.");
}

function openDocs(){
  document.getElementById("modalTitle").textContent = "ABSWAR DOCS";
  document.getElementById("modalBody").innerHTML = `
    <p>ABSWAR, ülke tabanlı realtime cyberpunk savaş MMO betasıdır. NFT ve token sistemi yoktur.</p>
    <ul>
      <li>MetaMask ile giriş yap.</li>
      <li>Türkiye tarafına katıl.</li>
      <li>Market üzerinden demo mermi al.</li>
      <li>Düşman ülkelere saldırarak ülke HP sistemini etkilersin.</li>
      <li>Alliance sistemi takım savaşları için kullanılır.</li>
    </ul>
  `;
  document.getElementById("modal").classList.add("show");
}

function openPanel(type){
  const title = document.getElementById("modalTitle");
  const body = document.getElementById("modalBody");

  if(type === "countries"){
    title.textContent = "COUNTRIES";
    body.innerHTML = (gameState?.countries || []).map(c =>
      `<p>${c.flag} <b>${c.name}</b> — HP: ${c.hp.toLocaleString()}</p>`
    ).join("") || "<p>Veri yükleniyor...</p>";
  }

  if(type === "alliances"){
    title.textContent = "ALLIANCES";
    body.innerHTML = (gameState?.alliances || []).map(a =>
      `<p><b>${a.name}</b> — Score: ${a.score} — Members: ${a.members.length}</p>`
    ).join("") || "<p>Henüz alliance yok.</p>";
  }

  if(type === "ranking"){
    title.textContent = "RANKING";
    body.innerHTML = (gameState?.leaderboard || []).map((p,i) =>
      `<p>#${i+1} ${p.wallet.slice(0,12)} — ${p.contribution} pts</p>`
    ).join("") || "<p>Henüz ranking yok.</p>";
  }

  if(type === "market"){
    title.textContent = "MARKET";
    body.innerHTML = "<p>Buy butonları doğrudan ekrandaki ammo market alanından çalışır.</p>";
  }

  if(type === "history"){
    title.textContent = "ATTACK HISTORY";
    body.innerHTML = (gameState?.recentAttacks || []).map(a =>
      `<p>⚔️ ${a.from_country} → ${a.target_country} — -${a.damage} HP</p>`
    ).join("") || "<p>Henüz saldırı yok.</p>";
  }

  if(type === "news"){
    title.textContent = "WAR NEWS";
    body.innerHTML = "<p>Germany defenses collapsing!</p><p>USA alliance under attack!</p><p>Turkey launched a massive offensive!</p>";
  }

  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}

const socket = io(API, { transports:["websocket","polling"] });
socket.on("war:state", d => gameState = d);
socket.on("war:attack", a => toast("Live attack: " + a.from_country + " → " + a.target_country));
socket.on("alliance:feed", x => toast(x.message));

loadState();
setInterval(loadState, 4000);
</script>
