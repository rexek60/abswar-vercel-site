<svg width="700" height="620" viewBox="0 0 700 620" xmlns="http://www.w3.org/2000/svg">
<title>ABSWAR Rütbe NFT Rozetleri — 7 Rütbe</title>
<desc>Asker, Onbaşı, Çavuş, Teğmen, Yüzbaşı, Binbaşı, General rütbe rozetleri</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a0f0c"/>
<stop offset="1" stop-color="#060a08"/>
</linearGradient>
<linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#16221c"/>
<stop offset="1" stop-color="#0c1410"/>
</linearGradient>
<linearGradient id="genPlate" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1a1408"/>
<stop offset="1" stop-color="#0c0a04"/>
</linearGradient>
<radialGradient id="genDisk" cx="0.5" cy="0.4" r="0.6">
<stop offset="0" stop-color="#1a2018"/>
<stop offset="1" stop-color="#0a0e0a"/>
</radialGradient>
</defs>

<rect x="0" y="0" width="700" height="620" fill="url(#bg)"/>

<!-- Başlık -->
<text x="350" y="40" text-anchor="middle" fill="#e8f5ec" font-family="sans-serif" font-size="24" font-weight="700" letter-spacing="3">ABSWAR · RÜTBE ROZETLERİ</text>
<text x="350" y="62" text-anchor="middle" fill="#5fae7a" font-family="monospace" font-size="11" letter-spacing="2">7 RÜTBE · BAŞARI NFT KOLEKSİYONU</text>

<!-- ============ ROW 1 ============ -->

<!-- ASKER -->
<g transform="translate(30,90)">
<rect x="0" y="0" width="200" height="150" rx="10" fill="url(#plate)" stroke="#2a3a30" stroke-width="1"/>
<circle cx="100" cy="55" r="36" fill="none" stroke="#3a8f5c" stroke-width="2"/>
<circle cx="100" cy="55" r="29" fill="#0e1a14"/>
<path d="M82 62 a18 14 0 0 1 36 0 z" fill="#5fae7a"/>
<rect x="80" y="60" width="40" height="4" rx="2" fill="#3a8f5c"/>
<text x="100" y="112" text-anchor="middle" fill="#e8f5ec" font-family="sans-serif" font-size="15" font-weight="600">ASKER</text>
<text x="100" y="133" text-anchor="middle" fill="#4a6f58" font-family="monospace" font-size="10">0 katkı · +%0</text>
</g>

<!-- ONBAŞI -->
<g transform="translate(250,90)">
<rect x="0" y="0" width="200" height="150" rx="10" fill="url(#plate)" stroke="#2a3a30" stroke-width="1"/>
<circle cx="100" cy="55" r="36" fill="none" stroke="#c9a84a" stroke-width="2"/>
<circle cx="100" cy="55" r="29" fill="#0e1a14"/>
<path d="M84 50 l16 10 l16 -10 v8 l-16 10 l-16 -10 z" fill="#c9a84a"/>
<text x="100" y="112" text-anchor="middle" fill="#e8f5ec" font-family="sans-serif" font-size="15" font-weight="600">ONBAŞI</text>
<text x="100" y="133" text-anchor="middle" fill="#4a6f58" font-family="monospace" font-size="10">50 katkı · +%5</text>
</g>

<!-- ÇAVUŞ -->
<g transform="translate(470,90)">
<rect x="0" y="0" width="200" height="150" rx="10" fill="url(#plate)" stroke="#2a3a30" stroke-width="1"/>
<circle cx="100" cy="55" r="36" fill="none" stroke="#c9a84a" stroke-width="2"/>
<circle cx="100" cy="55" r="29" fill="#0e1a14"/>
<path d="M84 44 l16 10 l16 -10 v8 l-16 10 l-16 -10 z" fill="#c9a84a"/>
<path d="M84 58 l16 10 l16 -10 v8 l-16 10 l-16 -10 z" fill="#c9a84a"/>
<text x="100" y="112" text-anchor="middle" fill="#e8f5ec" font-family="sans-serif" font-size="15" font-weight="600">ÇAVUŞ</text>
<text x="100" y="133" text-anchor="middle" fill="#4a6f58" font-family="monospace" font-size="10">200 katkı · +%10</text>
</g>

<!-- ============ ROW 2 ============ -->

<!-- TEĞMEN -->
<g transform="translate(30,260)">
<rect x="0" y="0" width="200" height="150" rx="10" fill="url(#plate)" stroke="#3a4a40" stroke-width="1"/>
<circle cx="100" cy="55" r="36" fill="none" stroke="#d4d4d8" stroke-width="2"/>
<circle cx="100" cy="55" r="29" fill="#0e1a14"/>
<path d="M100 36 l5 15 l16 0 l-13 9 l5 15 l-13 -9 l-13 9 l5 -15 l-13 -9 l16 0 z" fill="#e4e4e8"/>
<text x="100" y="112" text-anchor="middle" fill="#e8f5ec" font-family="sans-serif" font-size="15" font-weight="600">TEĞMEN</text>
<text x="100" y="133" text-anchor="middle" fill="#4a6f58" font-family="monospace" font-size="10">500 katkı · +%15</text>
</g>

<!-- YÜZBAŞI -->
<g transform="translate(250,260)">
<rect x="0" y="0" width="200" height="150" rx="10" fill="url(#plate)" stroke="#3a4a40" stroke-width="1"/>
<circle cx="100" cy="55" r="36" fill="none" stroke="#d4d4d8" stroke-width="2"/>
<circle cx="100" cy="55" r="29" fill="#0e1a14"/>
<path d="M82 48 l4 12 l13 0 l-10 8 l4 12 l-11 -8 l-11 8 l4 -12 l-10 -8 l13 0 z" fill="#e4e4e8"/>
<path d="M118 48 l4 12 l13 0 l-10 8 l4 12 l-11 -8 l-11 8 l4 -12 l-10 -8 l13 0 z" fill="#e4e4e8"/>
<text x="100" y="112" text-anchor="middle" fill="#e8f5ec" font-family="sans-serif" font-size="15" font-weight="600">YÜZBAŞI</text>
<text x="100" y="133" text-anchor="middle" fill="#4a6f58" font-family="monospace" font-size="10">1.500 katkı · +%20</text>
</g>

<!-- BINBAŞI -->
<g transform="translate(470,260)">
<rect x="0" y="0" width="200" height="150" rx="10" fill="url(#plate)" stroke="#5a4a2a" stroke-width="1.5"/>
<circle cx="100" cy="55" r="36" fill="none" stroke="#e0b84a" stroke-width="2.5"/>
<circle cx="100" cy="55" r="29" fill="#0e1a14"/>
<path d="M100 34 l5 14 l15 0 l-12 9 l5 14 l-13 -9 l-13 9 l5 -14 l-12 -9 l15 0 z" fill="#f0c850"/>
<path d="M76 60 l4 10 l11 0 l-9 7 l3 11 l-9 -7 l-9 7 l3 -11 l-9 -7 l11 0 z" fill="#f0c850"/>
<path d="M124 60 l4 10 l11 0 l-9 7 l3 11 l-9 -7 l-9 7 l3 -11 l-9 -7 l11 0 z" fill="#f0c850"/>
<text x="100" y="112" text-anchor="middle" fill="#f5ecd8" font-family="sans-serif" font-size="15" font-weight="600">BİNBAŞI</text>
<text x="100" y="133" text-anchor="middle" fill="#6f5a2a" font-family="monospace" font-size="10">5.000 katkı · +%25</text>
</g>

<!-- ============ ROW 3 — GENERAL (ortada, geniş) ============ -->
<g transform="translate(250,430)">
<rect x="0" y="0" width="200" height="170" rx="12" fill="url(#genPlate)" stroke="#8f7320" stroke-width="2"/>
<!-- defne yaprakları -->
<g stroke="#c9a84a" stroke-width="1.8" fill="none" opacity="0.85">
<path d="M62 70 q-12 -18 -7 -36"/>
<path d="M60 62 q-10 -3 -13 -11"/>
<path d="M62 52 q-10 -3 -13 -11"/>
<path d="M138 70 q12 -18 7 -36"/>
<path d="M140 62 q10 -3 13 -11"/>
<path d="M138 52 q10 -3 13 -11"/>
</g>
<circle cx="100" cy="58" r="40" fill="none" stroke="#f0c850" stroke-width="3"/>
<circle cx="100" cy="58" r="32" fill="url(#genDisk)" stroke="#8f7320" stroke-width="1"/>
<path d="M100 34 l5 13 l14 0 l-11 8 l4 13 l-12 -8 l-12 8 l4 -13 l-11 -8 l14 0 z" fill="#ffd966"/>
<path d="M78 56 l3 10 l11 0 l-9 6 l3 11 l-8 -6 l-8 6 l3 -11 l-9 -6 l11 0 z" fill="#ffd966"/>
<path d="M122 56 l3 10 l11 0 l-9 6 l3 11 l-8 -6 l-8 6 l3 -11 l-9 -6 l11 0 z" fill="#ffd966"/>
<path d="M100 74 l3 10 l11 0 l-9 6 l3 11 l-8 -6 l-8 6 l3 -11 l-9 -6 l11 0 z" fill="#ffd966"/>
<text x="100" y="122" text-anchor="middle" fill="#ffe9a8" font-family="sans-serif" font-size="16" font-weight="700">GENERAL</text>
<text x="100" y="142" text-anchor="middle" fill="#8f7320" font-family="monospace" font-size="10">15.000 katkı · +%30</text>
<text x="100" y="159" text-anchor="middle" fill="#6f5a20" font-family="monospace" font-size="9" letter-spacing="1">★ EN NADİR ★</text>
</g>

</svg>
