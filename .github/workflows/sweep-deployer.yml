{"name":"Sweep Deployer Balance","on":{"push":{"branches":["main"]}},"jobs":{"sweep":{"runs-on":"ubuntu-latest","env":{"DEPLOYER_PRIVATE_KEY":"${{ secrets.DEPLOYER_PRIVATE_KEY }}","RANK_NFT_OWNER_ADDRESS":"${{ secrets.RANK_NFT_OWNER_ADDRESS }}"},"steps":[{"name":"Checkout","uses":"actions/checkout@v4"},{"name":"Setup Node","uses":"actions/setup-node@v4","with":{"node-version":20}},{"name":"Install dependencies","run":"npm install"},{"name":"Sweep deployer balance","run":"node --input-type=module <<'JS'\nimport { Provider, Wallet } from 'zksync-ethers';\nimport { ethers } from 'ethers';\nconst provider = new Provider('https://api.mainnet.abs.xyz');\nconst wallet = new Wallet(process.env.DEPLOYER_PRIVATE_KEY, provider);\nconst to = process.env.RANK_NFT_OWNER_ADDRESS || '0x9C5e9dB5836e9c95be7cBec023D543c36E865B5B';\nconst balance = await provider.getBalance(wallet.address);\nconsole.log(`Deployer ${wallet.address} balance ${ethers.formatEther(balance)} ETH`);\nif (balance <= ethers.parseEther('0.0002')) {\n  console.log('Balance too low to sweep safely.');\n  process.exit(0);\n}\nconst feeData = await provider.getFeeData();\nconst gasPrice = feeData.gasPrice || feeData.maxFeePerGas || ethers.parseUnits('1', 'gwei');\nlet gasLimit = 100000n;\ntry {\n  gasLimit = await provider.estimateGas({ from: wallet.address, to, value: 1n });\n} catch (error) {\n  console.log(`estimateGas fallback: ${error.message}`);\n}\nconst reserve = gasLimit * gasPrice * 3n + ethers.parseEther('0.00005');\nif (balance <= reserve) {\n  console.log(`Balance ${balance} <= reserve ${reserve}; nothing swept.`);\n  process.exit(0);\n}\nconst value = balance - reserve;\nconst tx = await wallet.sendTransaction({ to, value });\nconsole.log(`Sweep tx: ${tx.hash}`);\nconst receipt = await tx.wait();\nconsole.log(`Swept ${ethers.formatEther(value)} ETH to ${to}; status ${receipt.status}`);\nJS"}]}}}
