name: Sweep Rank Deployer
on:
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      ADMIN_ADDRESS: "0x9C5e9dB5836e9c95be7cBec023D543c36E865B5B"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Sweep leftover ETH
        run: |
          node --input-type=module <<'NODE'
          const { Provider, Wallet } = await import('zksync-ethers');
          const provider = new Provider('https://api.mainnet.abs.xyz');
          const wallet = new Wallet(process.env.DEPLOYER_PRIVATE_KEY, provider);
          const balance = await provider.getBalance(wallet.address);
          const reserve = 80000000000000n;
          console.log('Deployer:', wallet.address);
          console.log('Balance wei:', balance.toString());
          if (balance <= reserve) { console.log('Nothing to sweep'); process.exit(0); }
          const value = balance - reserve;
          const tx = await wallet.sendTransaction({ to: process.env.ADMIN_ADDRESS, value });
          console.log('Sweep tx:', tx.hash);
          console.log('Swept wei:', value.toString());
          await tx.wait();
          console.log('Sweep complete');
          NODE
